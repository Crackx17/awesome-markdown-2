name: "Correct an entry / 纠正条目"
description: "Report outdated or inaccurate information. 反馈过时或不准确的信息。"
body:
  - type: textarea
    id: entry
    attributes:
      label: "Entry URL / 条目链接"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: "Problem observed / 观察到的问题"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Suggested correction or evidence (optional) / 建议修改或依据（选填）"
    validations:
      required: false
