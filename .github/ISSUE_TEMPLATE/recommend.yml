name: "Recommend a tool / 推荐工具"
description: "Suggest a resource with a clear Markdown use case. 推荐有明确 Markdown 用途的资源。"
body:
  - type: textarea
    id: tool
    attributes:
      label: "Name and official URL / 名称与官方链接"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: "Use case and recommendation reason / 用途与推荐理由"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "Evidence and limits (optional) / 官方依据、支持范围与限制（选填）"
    validations:
      required: false
  - type: textarea
    id: affiliation
    attributes:
      label: "Affiliation / 你与项目的关系"
    validations:
      required: true
